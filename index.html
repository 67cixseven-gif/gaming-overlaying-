<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Overlay</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f7f2;
      --muted: #aeb8af;
      --panel: #17201b;
      --accent: #b8ef6b;
      --accent-ink: #15210f;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background: #0d120f;
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(100%, 560px);
      padding: clamp(28px, 7vw, 64px);
      border: 1px solid #314139;
      background: var(--panel);
      box-shadow: 16px 16px 0 #26352c;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font: 700 12px/1.2 sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 380px;
      margin: 0;
      font-size: clamp(42px, 10vw, 76px);
      line-height: 0.92;
      letter-spacing: 0;
    }

    p {
      max-width: 400px;
      margin: 24px 0 30px;
      color: var(--muted);
      font: 16px/1.55 sans-serif;
    }

    a {
      display: inline-block;
      padding: 14px 18px;
      color: var(--accent-ink);
      background: var(--accent);
      font: 700 15px/1 sans-serif;
      text-decoration: none;
    }

    a:hover { background: #d0ffa0; }

    small {
      display: block;
      margin-top: 18px;
      color: #758279;
      font: 12px/1.4 sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Android utility</p>
    <h1>Game Overlay</h1>
    <p>Floating tools for a more capable mobile gaming setup.</p>
    <a href="GameOverlay-debug.apk" download>Download APK</a>
    <small>Debug build · Android 8.0 and newer</small>
  </main>
</body>
</html>
